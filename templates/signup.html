<!DOCTYPE html>
<html>

<head>
    <title>Blog-Lite | Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style.css') }}">
</head>

<body>
    <div class="top_bar">
        <div name="app_name" class="app_title_container">
            <span class="app_title" style="color: yellow">
                Blog-Lite</span>
            <span class="app_title">
                |</span>
            <span class="page_details">Sign Up</span>
        </div>
    </div>
    <div class="error_prompt">
        {{ error }}
    </div>
    <br>
    <div class="login_signup_bar">
        <form action="/signup" method="post">
            <span style="font-size: larger;">
                Create your account
            </span>
            <br><br><br>
            <input name="firstname" type="text" class="text" placeholder="First Name" required><br><br>
            <input name="lastname" type="text" class="text" placeholder="Last Name" required><br><br>
            <input name="username" type="text" class="text" placeholder="Username" required><br><br>
            <input name="email" type="email" class="text" placeholder="Email" required><br><br>
            <input name="password" type="password" class="text" placeholder="Password" required><br><br>
            <input name="confirm_password" type="password" class="text" placeholder="Confirm Password" required><br><br>
            <button type="submit" class="button">Sign Up</button><br><br>
            <hr style="color: wheat">
            <br>
        </form>
        <div>
            <a href="/" style="color: white;">
                <button class="button" style="background-color: blue;">Log in</button>
            </a>
        </div>
    </div>

    <footer style="text-align:center; color:#999;">
        &copy; Blog-Lite 1.1. All rights reserved.
    </footer>
</body>


</html>
