<html>

<head>
    <title>Blog-Lite | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style.css') }}">
</head>

<body>
    <div class="top_bar">

        <div>
            <a href="/"
                style="text-decoration: none; color: white; font-family: Tahoma; font-size: 70px; margin-left: 20px;">Blog-Lite</a>

            <br>
            <p style="color: white; margin-left: 20px;">Pen down your thoughts and share it with the world.</p>
            <!-- <a href="/signup" style="text-decoration: none; color: white; float: right; margin-right: 20px; margin-top: 20px;">Signup</a> -->
        </div>
        <!-- <div style="text-align: right; margin-right: 20px;"> -->

    </div>
    </div>
    <br>
    <div style="text-align: center;" class="danger">
        {{ error }}
    </div>

    <div class="login_signup_bar" style="width: fit-content;">
        <form action="/login" method="post">
            Login to Blog-Lite<br><br>
            <!-- <label>Email or Username:</label> -->
            <input name="user_id" type="text" class="text" placeholder="Email or Username"><br><br>
            <!-- <label>Password:</label> -->
            <input name="password" type="password" class="text" placeholder="Password"><br><br>
            <button type="submit" class="button">Login</button><br><br>
            <hr style="color: wheat">
            <br>
        </form>
        <div>
            <a href="/signup" style="color: white;"><button class="button"
                    style="background-color: rgb(59, 176, 59);">Create new
                    account</button></a>
        </div><br><br>
    </div>


</body>

</html>
