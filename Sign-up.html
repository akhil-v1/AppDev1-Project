<html>

<head>
    <title>Blog-Lite | Signup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">

        <div class="name">Blog-Lite </div>
        <div class="signup-button">Log-in</div>
    </div>
    <div class="login-bar">
        Signup to Blog-Lite<br><br>

        <input type="text" class="text" placeholder="First Name"><br><br>
        <input type="text" class="text" placeholder="Last Name"><br><br>
        <span style="font-weight: normal;">Gender:</span><br><br>
        <select class="text">
            <option>Male</option>
            <option>Female</option>
        </select><br><br>
        <input type="text" class="text" placeholder="Email"><br><br>
        <input type="password" class="text" placeholder="Password"><br><br>
        <input type="submit" class="button" value="Log-In"><br><br>
    </div>

</body>

</html>
